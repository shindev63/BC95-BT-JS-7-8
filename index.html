<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <title>Bài Tập Mảng - Full</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-blue-100 via-white to-green-100 min-h-screen flex items-center justify-center p-6">

    <div class="w-full max-w-4xl bg-white/80 backdrop-blur rounded-2xl shadow-xl p-6 space-y-6">

        <!-- TITLE -->
        <h1 class="text-3xl font-bold text-center text-gray-800">
            🚀 Bài tập mảng (JS BUỔI 7-8)
        </h1>

        <!-- INPUT -->
        <div class="flex gap-3">
            <input id="input" type="number" placeholder="Nhập số..."
                class="flex-1 p-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-400" />

            <button id="btnAdd" class="bg-blue-500 hover:bg-blue-600 text-white px-6 rounded-xl transition">
                ➕ Thêm
            </button>
        </div>

        <!-- ARRAY DISPLAY -->
        <div id="array" class="bg-green-100 text-green-800 p-4 rounded-xl font-medium shadow-inner">
            👉
        </div>

        <!-- TASKS -->
        <div id="tasks" class="space-y-3"></div>

    </div>

    <script src="./js/app.js"></script>
</body>

</html>
